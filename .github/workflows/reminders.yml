name: Irrigation Task Reminders

on:
  # Two offset schedules provide a second opportunity if one scheduled event is delayed or dropped.
  # GitHub notes scheduled workflows can be delayed during high Actions load.
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder endpoint
        run: |
          curl --fail-with-body --silent --show-error \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://irrigation-dashboard-bareilly-sigma.vercel.app/api/reminders"
