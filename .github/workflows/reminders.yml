name: Irrigation Task Reminders

on:
  # Two offset schedules provide a second opportunity if one scheduled event is delayed or dropped.
  # The minute offsets are intentionally away from the start of the hour.
  # Updating the cron also reactivates a scheduled workflow if GitHub has disabled it.
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
    - cron: '8,18,28,38,48,58 * * * *'
  workflow_dispatch:

jobs:
  reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder endpoint
        run: |
          curl --fail-with-body --silent --show-error \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://irrigation-dashboard-bareilly-sigma.vercel.app/api/reminders"
